[versions]
# https://parchmentmc.org/docs/getting-started
parchment-minecraft = "1.21.1"
parchment = "2024.11.17"

# https://projects.neoforged.net/neoforged/neoforge
neoforge = "21.1.220"

# https://fabricmc.net/develop
# Fabric is disabled on 1.21.1
fabric-loader = "0.18.4"

create = "6.0.10-272"
ponder = "1.0.81+mc1.21.1"
flywheel = "1.0.6"
registrate = "MC1.21-1.3.0+67"

[libraries]
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

neoforge-create = { module = "com.simibubi.create:create-1.21.1", version.ref = "create" }
neoforge-ponder = { module = "net.createmod.ponder:ponder-neoforge", version.ref = "ponder" }
neoforge-flywheel = { module = "dev.engine-room.flywheel:flywheel-neoforge-1.21.1", version.ref = "flywheel" }
neoforge-registrate = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }

[bundles]
neoforge-runtime = ["neoforge-flywheel", "neoforge-registrate"]
