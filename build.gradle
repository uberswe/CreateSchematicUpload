plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.13-SNAPSHOT" apply false
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()

        mixin {
            useLegacyMixinAp = false
        }
    }

    jar {
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Version'   : project.jar.archiveVersion,
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : minecraft_version,
            ])
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment "org.parchmentmc.data:parchment-${libs.versions.parchment.minecraft.get()}:${libs.versions.parchment.asProvider().get()}@zip"
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    version = rootProject.version
    group = rootProject.group

    repositories {
        mavenCentral()

        maven {
            name = "ParchmentMC"
            url = "https://maven.parchmentmc.org"
        }

        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }

        maven {
            name = "Create Maven"
            url = "https://maven.createmod.net"
        }

        maven {
            name = "Flywheel Maven"
            url = "https://maven.ithundxr.dev/snapshots"
        }

        maven {
            name = "BlameJared Maven"
            url = "https://maven.blamejared.com"
        }

        maven {
            name = "SquidDev Maven"
            url = "https://maven.squiddev.cc"
        }

        maven {
            name = "TheIllusiveC4 Maven"
            url = "https://maven.theillusivec4.top/"
        }

        maven {
            name = "FTB"
            url = "https://maven.ftb.dev/releases/"
        }

        maven {
            name = "Journey Map"
            url = "https://jm.gserv.me/repository/maven-public"
        }
    }

    base {
        archivesName = "createschematicdownload"
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    tasks.create("prepareWorkspace") {}

    java {
        withSourcesJar()
    }
}
