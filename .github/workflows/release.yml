name: Release

on:
  release:
    types: [published]

# Note: RELEASE_TAG and RELEASE_CHANGELOG are used only as action input
# parameters (not in run: commands), so they are safe from injection.
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_CHANGELOG: ${{ github.event.release.body }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            forge/build/libs/!(*-sources).jar
            fabric/build/libs/!(*-sources).jar

      - name: Publish Forge to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: CreateSchematicUpload ${{ env.RELEASE_TAG }} (Forge)
          version: ${{ env.RELEASE_TAG }}+forge
          version-type: release
          changelog: ${{ env.RELEASE_CHANGELOG }}

          game-versions: 1.19.2
          loaders: forge
          dependencies: |
            create(required)

          files: forge/build/libs/!(*-sources).jar

      - name: Publish Fabric to CurseForge and Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: CreateSchematicUpload ${{ env.RELEASE_TAG }} (Fabric)
          version: ${{ env.RELEASE_TAG }}+fabric
          version-type: release
          changelog: ${{ env.RELEASE_CHANGELOG }}

          game-versions: 1.19.2
          loaders: fabric
          dependencies: |
            create(required)
            fabric-api(required)

          files: fabric/build/libs/!(*-sources).jar
