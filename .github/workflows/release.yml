name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.1.0)'
        required: true
      changelog:
        description: 'Release notes (optional)'
        required: false
        default: ''
      publish:
        description: 'Publish to CurseForge & Modrinth'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: mc/1.18.2
            game-version: '1.18.2'
            java: '17'
            forge-loaders: forge
          - branch: mc/1.19.2
            game-version: '1.19.2'
            java: '17'
            forge-loaders: forge
          - branch: mc/1.20.1
            game-version: '1.20.1'
            java: '17'
            forge-loaders: "forge\nneoforge"
          - branch: main
            game-version: '1.21.1'
            java: '21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          # Strip leading 'v' from version tag for Gradle
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          ./gradlew build -Pmod_version="${version}"

      - name: Verify JARs
        run: ./scripts/verify-jars.sh

      - name: Find built JARs
        id: jars
        run: |
          find_jar() {
            local dir="$1"
            if [ -d "$dir" ]; then
              # Find JARs excluding sources JARs
              local jar
              jar=$(find "$dir" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -1)
              if [ -n "$jar" ]; then
                echo "$jar"
                return 0
              fi
            fi
            return 1
          }

          forge_jar=$(find_jar forge/build/libs) || true
          neoforge_jar=$(find_jar neoforge/build/libs) || true
          fabric_jar=$(find_jar fabric/build/libs) || true

          echo "forge_jar=${forge_jar}" >> "$GITHUB_OUTPUT"
          echo "neoforge_jar=${neoforge_jar}" >> "$GITHUB_OUTPUT"
          echo "fabric_jar=${fabric_jar}" >> "$GITHUB_OUTPUT"

          echo "Found JARs:"
          echo "  forge: ${forge_jar:-none}"
          echo "  neoforge: ${neoforge_jar:-none}"
          echo "  fabric: ${fabric_jar:-none}"

      - name: Upload Forge JAR
        if: steps.jars.outputs.forge_jar != ''
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.game-version }}
          path: ${{ steps.jars.outputs.forge_jar }}

      - name: Upload NeoForge JAR
        if: steps.jars.outputs.neoforge_jar != ''
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-${{ matrix.game-version }}
          path: ${{ steps.jars.outputs.neoforge_jar }}

      - name: Upload Fabric JAR
        if: steps.jars.outputs.fabric_jar != ''
        uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.game-version }}
          path: ${{ steps.jars.outputs.fabric_jar }}

      # Publish Forge
      - name: Publish Forge to CurseForge & Modrinth
        if: steps.jars.outputs.forge_jar != '' && (github.event_name == 'push' || inputs.publish)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: CreateSchematicHelper ${{ inputs.version || github.ref_name }} (Forge ${{ matrix.game-version }})
          version: ${{ inputs.version || github.ref_name }}+${{ matrix.game-version }}-forge
          version-type: release
          changelog: ${{ inputs.changelog || '' }}

          game-versions: ${{ matrix.game-version }}
          loaders: ${{ matrix.forge-loaders }}
          dependencies: |
            create(required)

          files: ${{ steps.jars.outputs.forge_jar }}

      # Publish NeoForge
      - name: Publish NeoForge to CurseForge & Modrinth
        if: steps.jars.outputs.neoforge_jar != '' && (github.event_name == 'push' || inputs.publish)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: CreateSchematicHelper ${{ inputs.version || github.ref_name }} (NeoForge ${{ matrix.game-version }})
          version: ${{ inputs.version || github.ref_name }}+${{ matrix.game-version }}-neoforge
          version-type: release
          changelog: ${{ inputs.changelog || '' }}

          game-versions: ${{ matrix.game-version }}
          loaders: neoforge
          dependencies: |
            create(required)

          files: ${{ steps.jars.outputs.neoforge_jar }}

      # Publish Fabric
      - name: Publish Fabric to CurseForge & Modrinth
        if: steps.jars.outputs.fabric_jar != '' && (github.event_name == 'push' || inputs.publish)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          name: CreateSchematicHelper ${{ inputs.version || github.ref_name }} (Fabric ${{ matrix.game-version }})
          version: ${{ inputs.version || github.ref_name }}+${{ matrix.game-version }}-fabric
          version-type: release
          changelog: ${{ inputs.changelog || '' }}

          game-versions: ${{ matrix.game-version }}
          loaders: fabric
          dependencies: |
            create(required)
            fabric-api(required)

          files: ${{ steps.jars.outputs.fabric_jar }}

      # Keep the checked-in mod_version in sync with what was just published, so
      # local/dev builds on this branch are stamped with the released version.
      - name: Commit version bump
        if: github.event_name == 'push' || inputs.publish
        run: |
          version="${{ inputs.version || github.ref_name }}"
          version="${version#v}"
          sed -i "s/^mod_version=.*/mod_version=${version}/" gradle.properties
          if git diff --quiet gradle.properties; then
            echo "mod_version already ${version}, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Bump mod_version to ${version}"
          git push origin "HEAD:${{ matrix.branch }}"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect JARs
        run: |
          mkdir -p release-jars
          find artifacts -name '*.jar' -exec cp {} release-jars/ \;
          echo "Release JARs:"
          ls -la release-jars/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: CreateSchematicHelper ${{ inputs.version || github.ref_name }}
          body: ${{ inputs.changelog || '' }}
          generate_release_notes: true
          files: release-jars/*.jar
