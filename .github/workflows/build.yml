name: Build

on:
  push:
    branches: [main, 'mc/**']
  pull_request:
    branches: [main, 'mc/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Java version
        id: props
        run: |
          java_version=$(grep '^java_version=' gradle.properties | cut -d= -f2)
          echo "java_version=${java_version}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Verify JARs
        run: ./scripts/verify-jars.sh

      - name: Find built JARs
        id: jars
        run: |
          find_jar() {
            local dir="$1"
            if [ -d "$dir" ]; then
              local jar
              jar=$(find "$dir" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -1)
              if [ -n "$jar" ]; then
                echo "$jar"
                return 0
              fi
            fi
            return 1
          }

          forge_jar=$(find_jar forge/build/libs) || true
          neoforge_jar=$(find_jar neoforge/build/libs) || true
          fabric_jar=$(find_jar fabric/build/libs) || true

          echo "forge_jar=${forge_jar}" >> "$GITHUB_OUTPUT"
          echo "neoforge_jar=${neoforge_jar}" >> "$GITHUB_OUTPUT"
          echo "fabric_jar=${fabric_jar}" >> "$GITHUB_OUTPUT"

      - name: Upload Forge artifact
        if: steps.jars.outputs.forge_jar != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateSchematicUpload-Forge
          path: ${{ steps.jars.outputs.forge_jar }}

      - name: Upload NeoForge artifact
        if: steps.jars.outputs.neoforge_jar != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateSchematicUpload-NeoForge
          path: ${{ steps.jars.outputs.neoforge_jar }}

      - name: Upload Fabric artifact
        if: steps.jars.outputs.fabric_jar != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateSchematicUpload-Fabric
          path: ${{ steps.jars.outputs.fabric_jar }}
