name: Build

on:
  push:
    branches: [main, 'mc/**']
  pull_request:
    branches: [main, 'mc/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Java version
        id: props
        run: |
          java_version=$(grep '^java_version=' gradle.properties | cut -d= -f2)
          echo "java_version=${java_version}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.props.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload Forge artifact
        if: hashFiles('forge/build/libs/*.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateSchematicUpload-Forge
          path: forge/build/libs/!(*-sources).jar

      - name: Upload NeoForge artifact
        if: hashFiles('neoforge/build/libs/*.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateSchematicUpload-NeoForge
          path: neoforge/build/libs/!(*-sources).jar

      - name: Upload Fabric artifact
        if: hashFiles('fabric/build/libs/*.jar') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CreateSchematicUpload-Fabric
          path: fabric/build/libs/!(*-sources).jar
