name: Build

on:
  push:
    branches: [main, mc/*]
  pull_request:
    branches: [main, mc/*]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('forge/build/libs/*.jar') != '' }}
        with:
          name: CreateSchematicUpload-Forge
          path: forge/build/libs/!(*-sources).jar

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('neoforge/build/libs/*.jar') != '' }}
        with:
          name: CreateSchematicUpload-NeoForge
          path: neoforge/build/libs/!(*-sources).jar

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('fabric/build/libs/*.jar') != '' }}
        with:
          name: CreateSchematicUpload-Fabric
          path: fabric/build/libs/!(*-sources).jar
